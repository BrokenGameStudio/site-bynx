  .center-content {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .welcome-text {
    margin: 0;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 48px;
    font-weight: bold;
    text-align: center;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    white-space: nowrap;
  }

  .subtitle-text {
    margin: 0;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    font-weight: normal;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    white-space: nowrap;
  }

  .images-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .mod-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .mod-card:hover {
    transform: translateY(-6px) scale(1.03);
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.35));
  }

  .mod-image {
    width: 160px;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.6);
  }

  .mod-label {
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    letter-spacing: 0.04em;
  }

  .github-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .github-card {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 24px;
    padding: 8px 16px;
    color: #ffffff;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .github-card:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.28);
  }

  .gh-avatar-placeholder, .gh-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: rgba(255,255,255,0.3);
    border: 1px solid rgba(255,255,255,0.5);
    flex-shrink: 0;
  }

  .gh-info {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
  }

  .github-label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  .gh-stats {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.85);
  }

<body>
  <div class="bg-wrapper">
    <div class="pattern"></div>
    <div class="center-content">
      <h1 class="welcome-text">Bienvenue sur mon site</h1>
      <p class="subtitle-text">mes mods</p>
      <div class="images-row">
        <a class="mod-card" href="repo.html">
          <img class="mod-image" src="repo.jpg" alt="R.E.P.O.">
          <span class="mod-label">R.E.P.O.</span>
        </a>
        <a class="mod-card" href="peak.html">
          <img class="mod-image" src="peak.png" alt="PEAK">
          <span class="mod-label">PEAK</span>
        </a>
      </div>

      <div class="github-row" id="github-row">
        <a class="github-card" id="gh-card-BrokenGameStudio" href="https://github.com/BrokenGameStudio" target="_blank" rel="noopener">
          <div class="gh-avatar-placeholder"></div>
          <div class="gh-info">
            <span class="github-label">BrokenGameStudio</span>
            <span class="gh-stats">chargement...</span>
          </div>
        </a>
        <a class="github-card" id="gh-card-Axelfla" href="https://github.com/Axelfla" target="_blank" rel="noopener">
          <div class="gh-avatar-placeholder"></div>
          <div class="gh-info">
            <span class="github-label">Axelfla</span>
            <span class="gh-stats">chargement...</span>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    async function loadGithubCard(username) {
      const card = document.getElementById('gh-card-' + username);
      if (!card) return;
      const avatarEl = card.querySelector('.gh-avatar-placeholder');
      const statsEl = card.querySelector('.gh-stats');
      try {
        const res = await fetch('https://api.github.com/users/' + username);
        if (!res.ok) throw new Error('status ' + res.status);
        const data = await res.json();

        const img = document.createElement('img');
        img.className = 'gh-avatar';
        img.src = data.avatar_url;
        img.alt = username;
        avatarEl.replaceWith(img);

        const repos = data.public_repos ?? 0;
        const followers = data.followers ?? 0;
        statsEl.textContent = repos + ' repos · ' + followers + ' followers';
      } catch (err) {
        statsEl.textContent = 'Profil GitHub';
      }
    }

    loadGithubCard('BrokenGameStudio');
    loadGithubCard('Axelfla');
  </script>
</body>
