  .welcome-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    margin: 0;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 48px;
    font-weight: bold;
    text-align: center;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    z-index: 2;
    white-space: nowrap;
  }

  .subtitle-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, 20px);
    margin: 0;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    font-weight: normal;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    z-index: 2;
    white-space: nowrap;
  }

  .images-row {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, 70px);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 24px;
    z-index: 2;
  }

  .mod-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .mod-card:hover {
    transform: translateY(-6px) scale(1.03);
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.35));
  }

  .mod-image {
    width: 160px;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.6);
  }

  .mod-label {
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    letter-spacing: 0.04em;
